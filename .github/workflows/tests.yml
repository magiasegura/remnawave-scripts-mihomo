name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shell-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5, Node.js 24
        with:
          persist-credentials: false
      - name: Validate changed entrypoints and helpers
        run: |
          bash -n remnanode.sh
          bash -n remnanode-xray-update.sh
          bash -n tests/test-upstream-sync.sh
      - name: Run all suites on Linux
        run: bash tests/run-tests.sh
